# To The Crown — pile complète : docker compose up --build
# Client : http://localhost:${WEB_PORT:-8080}
name: to-the-crown

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ttc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ttc}
      POSTGRES_DB: tothecrown
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ttc -d tothecrown']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: server
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://ttc:${POSTGRES_PASSWORD:-ttc}@postgres:5432/tothecrown
      REDIS_URL: redis://redis:6379
      SOCKET_REDIS_ADAPTER: 'true'
      # Obligatoire : secret long et aléatoire (voir .env.example).
      SESSION_SECRET: ${SESSION_SECRET:?Définissez SESSION_SECRET (32 caractères minimum) dans .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      TRUST_PROXY: 'true'
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 25s

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
